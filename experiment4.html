<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
    <B>   <h1 align="center">Hotel Room Booking Form</h1> </B>
    <p align="center"

       <label for="Full Name">Full Name</label> 
       <input type="text" name="Full Name" id="Full Name" placeholder="Enter your full name" required>
       <br><br>

<label for="email">Email:</label>
<input type="Email" name="email" id="email"
placeholder="Enter Your Email" required>

<br><br>

<label for="phone">Phone Number:</label>
<input type="tel" name="phone" id="phone" placeholder="Enter your phone number" required>

<br><br>

<label for="checkin">Check-in Date:</label>
<input type="date" name="checkin" id="checkin" required>

<br><br>

<label for="checkout">Check-out Date:</label>
<input type="date" name="checkout" id="checkout" required>  

<br><br>

<label for="roomtype">Room Type:</label>
<select name="roomtype" id="roomtype" required></select>

<br><br>

<label for="guests">Number of Guests:</label>
<input type="number" name="guests" id="guests" required>

<br><br>

<label for="specialrequests">Special Requests:</label>
<textarea name="specialrequests" id="specialrequests" rows="4" cols="50" placeholder="Enter any special requests"></textarea>

<br><br>

<input type="submit" name="Sumbit" id="Sumbit" value="Submit">
<input type="reset" name="Reset" id="Reset" value="Reset">
    </p>















    </fieldset>
    
</body>
</html>
